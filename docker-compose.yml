services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    command:
      - --binlog-format=ROW
      - --binlog-row-image=FULL
      - --log-bin=mysql-bin
      - --server-id=1
      - --binlog_expire_logs_seconds=604800
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${DB_ROOT_PASSWORD}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce

  rustfs:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ROOT_USER: ${RUSTFS_ACCESS_KEY}
      RUSTFS_ROOT_PASSWORD: ${RUSTFS_SECRET_KEY}
    ports:
      - "9000:9000"
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce

  jaeger:
    image: jaegertracing/all-in-one:1.57
    ports:
      - "16686:16686"
      - "4318:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    networks:
      - ecommerce

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./infrastructure/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - ecommerce

  admin-service:
    build:
      context: .
      dockerfile: services/admin-service/Dockerfile
    environment:
      ADMIN_SERVICE_PORT: ${ADMIN_SERVICE_PORT}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      INVENTORY_SERVICE_HOST: inventory-service
      INVENTORY_SERVICE_PORT: ${INVENTORY_SERVICE_PORT}
      SERVICE_NAME: admin-service
      TRACING_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    depends_on:
      mysql:
        condition: service_healthy
      inventory-service:
        condition: service_started
    networks:
      - ecommerce
    restart: unless-stopped

  inventory-service:
    build:
      context: .
      dockerfile: services/inventory-service/Dockerfile
    environment:
      INVENTORY_SERVICE_PORT: ${INVENTORY_SERVICE_PORT}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RUSTFS_ENDPOINT: http://rustfs:9000
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      RUSTFS_BUCKET: ${RUSTFS_BUCKET}
      SERVICE_NAME: inventory-service
      TRACING_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    networks:
      - ecommerce
    restart: unless-stopped

  customer-service:
    build:
      context: .
      dockerfile: services/customer-service/Dockerfile
    environment:
      CUSTOMER_SERVICE_PORT: ${CUSTOMER_SERVICE_PORT}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      OAUTH_SUPPORTED_PROVIDERS: ${OAUTH_SUPPORTED_PROVIDERS}
      OAUTH_GOOGLE_CLIENT_ID: ${OAUTH_GOOGLE_CLIENT_ID}
      INVENTORY_SERVICE_HOST: inventory-service
      INVENTORY_SERVICE_PORT: ${INVENTORY_SERVICE_PORT}
      SERVICE_NAME: customer-service
      TRACING_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      inventory-service:
        condition: service_started
    networks:
      - ecommerce
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    environment:
      GATEWAY_PORT: ${GATEWAY_PORT}
      CORS_ORIGIN: ${CORS_ORIGIN}
      ADMIN_SERVICE_HOST: admin-service
      ADMIN_SERVICE_PORT: ${ADMIN_SERVICE_PORT}
      INVENTORY_SERVICE_HOST: inventory-service
      INVENTORY_SERVICE_PORT: ${INVENTORY_SERVICE_PORT}
      CUSTOMER_SERVICE_HOST: customer-service
      CUSTOMER_SERVICE_PORT: ${CUSTOMER_SERVICE_PORT}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      JWT_EXPIRES_IN_ADMIN: ${JWT_EXPIRES_IN_ADMIN}
      JWT_EXPIRES_IN_CUSTOMER: ${JWT_EXPIRES_IN_CUSTOMER}
      SERVICE_NAME: gateway
      TRACING_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    ports:
      - "${GATEWAY_PORT}:${GATEWAY_PORT}"
    depends_on:
      - admin-service
      - inventory-service
      - customer-service
    networks:
      - ecommerce
    restart: unless-stopped

volumes:
  mysql_data:
  rustfs_data:

networks:
  ecommerce:
    driver: bridge
