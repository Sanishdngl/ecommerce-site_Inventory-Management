syntax = "proto3";

package customer;

import "common.proto";
import "inventory.proto";

message CustomerUser {
  string          id             = 1;
  string          email          = 2;
  string          first_name     = 3;
  string          last_name      = 4;
  optional string oauth_provider = 5;
  bool            is_active      = 6;
  string          created_at     = 7;
  string          updated_at     = 8;
}

message RegisterRequest {
  string email      = 1;
  string password   = 2;
  string first_name = 3;
  string last_name  = 4;
  string device_id          = 5;
  float  device_pixel_ratio = 6;
}

message LoginRequest {
  string email    = 1;
  string password = 2;
  string device_id = 3;
  float  device_pixel_ratio = 4;
}

message OAuthRequest {
  string provider = 1;   // e.g. "google"; must match configured provider in env
  string token    = 2;   // OAuth id_token or access token from provider
  string device_id = 3;
  float  device_pixel_ratio = 4;
}

message AuthResponse {
  CustomerUser customer = 1;
  string       refresh_token = 2;

}

message ProfileRequest {
  string customer_id = 1;
}

message UpdateProfileRequest {
  string          customer_id = 1;
  optional string first_name  = 2;
  optional string last_name   = 3;
  // email change is out of scope Phase 1
}

message CustomerResponse {
  CustomerUser customer = 1;
}

// Cart

message CartItemRequest {
  string customer_id = 1;
  string product_id  = 2;
  int32  quantity    = 3;   // must be > 0; use RemoveFromCart for zero
}

message RemoveCartRequest {
  string customer_id = 1;
  string product_id  = 2;
}

message GetCartRequest {
  string customer_id = 1;
}

message CartItem {
  string product_id    = 1;
  string product_name  = 2;
  string price         = 3;   // string; matches inventory price format
  string thumbnail_url = 4;
  int32  quantity      = 5;
  int32  stock_quantity = 6;  // hydrated from Inventory Service for front-end cap
}

message CartResponse {
  repeated CartItem items = 1;
}

message RefreshCustomerRequest {
  string refresh_token = 1;
}

message LogoutCustomerRequest{
  string refresh_token = 1;
}

message RefreshCustomerResponse {
  string customer_id   = 1;
  string refresh_token = 2;   // rotated
  CustomerUser customer      = 3;
}

service CustomerService {
  rpc RegisterCustomer(RegisterRequest)       returns (CustomerResponse);
  rpc LoginCustomer   (LoginRequest)          returns (AuthResponse);
  rpc OAuthLogin      (OAuthRequest)          returns (AuthResponse);
  rpc RefreshToken    (RefreshCustomerRequest) returns (RefreshCustomerResponse);
  rpc LogoutCustomer   (LogoutCustomerRequest)   returns (common.StatusResponse);

  
  rpc GetProfile      (ProfileRequest)        returns (CustomerResponse);
  rpc UpdateProfile   (UpdateProfileRequest)  returns (CustomerResponse);

  rpc AddToCart       (CartItemRequest)       returns (CartResponse);
  rpc UpdateCartItem  (CartItemRequest)       returns (CartResponse);
  rpc RemoveFromCart  (RemoveCartRequest)     returns (CartResponse);
  rpc GetCart         (GetCartRequest)        returns (CartResponse);

  rpc GetProduct     (inventory.GetProductRequest)     returns (inventory.ProductResponse);
  rpc ListProducts   (inventory.ListProductsRequest)   returns (inventory.ProductListResponse);
  rpc ListCategories (inventory.ListCategoriesRequest) returns (inventory.CategoryListResponse);

  rpc HealthCheck (common.Empty) returns (common.HealthStatus);
}