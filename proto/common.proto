syntax = "proto3";

package common;

message StatusResponse {
  bool    success = 1;
  string  message = 2;
}

message PaginationRequest {
  int32  page  = 1;
  int32  limit = 2;
}

message PaginationMeta {
  int32  total = 1;
  int32  page  = 2;
  int32  limit = 3;
}

message Empty {}

message HealthStatus {
  string service    = 1;
  bool   ok         = 2;
  string message    = 3;
  string checked_at = 4;
}